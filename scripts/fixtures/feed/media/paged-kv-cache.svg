<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="1200" height="600" fill="#f4f6fb"/>
  <text x="80" y="110" font-size="34" font-weight="700" fill="#151d48">Contiguous reservation</text>
  <text x="80" y="150" font-size="24" fill="#555b73">sized for the longest output; most of it never holds a token</text>
  <rect x="80" y="180" width="1040" height="90" rx="12" fill="#ffffff" stroke="#dce1ee" stroke-width="3"/>
  <rect x="80" y="180" width="300" height="90" rx="12" fill="#4a4cd4"/>
  <text x="400" y="236" font-size="26" fill="#555b73">reserved, unused</text>
  <text x="80" y="370" font-size="34" font-weight="700" fill="#151d48">Paged blocks</text>
  <text x="80" y="410" font-size="24" fill="#555b73">fixed-size blocks, allocated as tokens arrive</text>
  <g fill="#4a4cd4">
    <rect x="80" y="440" width="120" height="90" rx="12"/>
    <rect x="215" y="440" width="120" height="90" rx="12"/>
    <rect x="350" y="440" width="120" height="90" rx="12"/>
  </g>
  <rect x="485" y="440" width="120" height="90" rx="12" fill="#9698f7"/>
  <g fill="#ffffff" stroke="#dce1ee" stroke-width="3">
    <rect x="620" y="440" width="120" height="90" rx="12"/>
    <rect x="755" y="440" width="120" height="90" rx="12"/>
    <rect x="890" y="440" width="120" height="90" rx="12"/>
  </g>
  <text x="1030" y="496" font-size="24" fill="#555b73">free for</text>
  <text x="1030" y="526" font-size="24" fill="#555b73">others</text>
</svg>
