    <style>
      :root {
        --cyan: #22d3ee; --pink: #a855f7; --purple: #8b5cf6; --indigo: #6366f1;
        --blue: #8bd6ff; --ink: #e6ebf5; --dim: #93a1bd;
        --panel: rgba(9, 12, 24, 0.88); --line: rgba(130, 150, 200, 0.28);
        --disp: "Orbitron", ui-sans-serif, system-ui, sans-serif;
        --term: "VT323", ui-monospace, "Courier New", monospace;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: #010208; }
      body { color: var(--ink); font-family: ui-sans-serif, system-ui, sans-serif; }

      #c { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; display: block; cursor: grab; }
      #c.grabbing { cursor: grabbing; }
      #c.pointing { cursor: pointer; }

      .vign { position: fixed; inset: 0; z-index: 4; pointer-events: none;
        background: radial-gradient(125% 105% at 50% 40%, transparent 44%, rgba(0,0,2,0.9) 100%); }
      .grain { position: fixed; inset: 0; z-index: 4; pointer-events: none; opacity: .035; mix-blend-mode: screen;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>"); }

      #brand { position: fixed; top: 18px; left: 22px; z-index: 12; font: 700 13px/1 var(--term);
        letter-spacing: 3px; color: var(--cyan); text-decoration: none; text-shadow: 0 0 6px rgba(34,211,238,.4); opacity: .9; }
      #brand:hover { opacity: 1; }
      #brand b { color: var(--pink); }
      #chrome { position: fixed; top: 16px; right: 18px; z-index: 12; display: flex; gap: 8px; }
      #chrome button { font: 700 12px/1 var(--term); letter-spacing: 2px; padding: 8px 12px; border-radius: 9px; cursor: pointer;
        background: var(--panel); backdrop-filter: blur(8px); border: 1px solid var(--line); color: var(--ink); }

      #hero { position: fixed; inset: 0; z-index: 7; pointer-events: none; }
      #hero .kicker { position: absolute; left: 32px; bottom: calc(13vh + 210px);
        font: 700 13px/1 var(--term); letter-spacing: 6px; color: var(--purple); text-shadow: 0 0 8px rgba(139,92,246,.5); }
      #hero h1 { position: absolute; left: 30px; bottom: calc(13vh + 40px); margin: 0; font-family: var(--disp); font-weight: 900;
        line-height: .98; font-size: clamp(38px, 8vw, 82px); letter-spacing: 1px; color: var(--ink);
        text-shadow: 0 0 6px rgba(34,211,238,.4), 0 0 22px rgba(34,211,238,.2), 2px 0 0 rgba(168,85,247,.28); }
      #hero h1 .p { color: var(--pink); text-shadow: 0 0 8px rgba(168,85,247,.5), 0 0 24px rgba(168,85,247,.3); }
      #hero .sub { position: absolute; left: 32px; bottom: 13vh; margin: 0; max-width: min(46ch, 84vw);
        font: 400 clamp(17px,2.4vw,23px)/1.45 var(--term); color: #cfdaee; letter-spacing: .5px; text-shadow: 0 1px 10px rgba(0,0,0,.6); }
      #hero .hint2 { position: absolute; left: 32px; bottom: calc(13vh - 34px); font: 700 12px/1 var(--term);
        letter-spacing: 3px; color: var(--blue); opacity: .82; text-shadow: 0 0 8px rgba(139,214,255,.35); }

      #scroll { position: relative; z-index: 2; pointer-events: none; }
      section { min-height: 100vh; display: flex; align-items: center; }
      .card { pointer-events: auto; margin: 0 0 0 clamp(16px, 5vw, 84px); max-width: min(410px, 86vw);
        background: var(--panel); backdrop-filter: blur(12px); border: 1px solid var(--line); border-radius: 16px;
        padding: 20px 22px; box-shadow: 0 24px 60px -30px rgba(0,0,0,.8);
        opacity: 0; transform: translateY(16px); transition: opacity .5s, transform .5s; }
      section.active .card { opacity: 1; transform: none; }
      .eyebrow { font: 700 12px/1 var(--term); letter-spacing: 4px; text-transform: uppercase; color: var(--cyan); margin-bottom: 10px; text-shadow: 0 0 10px rgba(34,211,238,.4); }
      .card h2 { font-size: 24px; line-height: 1.16; margin: 0 0 11px; font-weight: 800; letter-spacing: -.01em; color: #f2f6ff; text-shadow: 0 2px 14px rgba(0,0,0,.55); }
      .card h2 em { font-style: normal; color: #c084fc; }
      .card p { font-size: 15px; line-height: 1.62; color: #c8d3e8; margin: 0; text-shadow: 0 1px 8px rgba(0,0,0,.5); }
      .card p b { color: #ffffff; font-weight: 700; }

      .heads { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 14px; }
      .head { display: inline-flex; align-items: center; gap: 7px; cursor: pointer; font: 600 12px/1 ui-sans-serif, system-ui;
        padding: 6px 10px; border-radius: 999px; background: rgba(255,255,255,.05); border: 1px solid var(--line);
        color: var(--ink); user-select: none; transition: opacity .15s; }
      .head .dot { width: 9px; height: 9px; border-radius: 999px; box-shadow: 0 0 8px currentColor; }
      .head.off { opacity: .35; }
      .hint { font-size: 12.5px; color: #b0bcd6; margin-top: 11px; font-family: var(--term); letter-spacing: 1px; }

      .cta { display: inline-flex; margin-top: 15px; font: 700 13px/1 var(--term); letter-spacing: 2px; text-decoration: none;
        padding: 11px 16px; border-radius: 10px; color: #04060e; background: linear-gradient(100deg, var(--cyan), var(--purple));
        box-shadow: 0 0 14px -2px rgba(34,211,238,.5); }

      #bars { position: fixed; right: clamp(16px, 6vw, 90px); top: 50%; transform: translateY(-50%); z-index: 6;
        width: min(300px, 42vw); pointer-events: none; opacity: 0; transition: opacity .5s; }
      #bars.show { opacity: 1; }
      #bars .brow { margin: 7px 0; }
      #bars .btop { display: flex; justify-content: space-between; font: 700 15px/1 var(--term); letter-spacing: 1px; margin-bottom: 5px; }
      #bars .btop .w { color: var(--ink); } #bars .btop .pct { color: var(--blue); }
      #bars .track { height: 8px; border-radius: 6px; background: rgba(255,255,255,.06); overflow: hidden; }
      #bars .fill { height: 100%; width: 0; border-radius: 6px; background: linear-gradient(90deg, var(--cyan), var(--purple)); transition: width .8s cubic-bezier(.2,.7,.2,1); }
      #bars .brow.win .w { color: var(--cyan); } #bars .brow.win .fill { background: linear-gradient(90deg, var(--cyan), var(--pink)); box-shadow: 0 0 12px -2px var(--cyan); }

      #scrollhint { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 10;
        font: 700 11px/1 var(--term); letter-spacing: 3px; color: var(--dim); animation: bob 1.8s ease-in-out infinite; }
      @keyframes bob { 0%,100% { transform: translate(-50%,0); opacity: .55; } 50% { transform: translate(-50%,6px); opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { #scrollhint { animation: none; } }
      @media (max-width: 620px) { .card { margin: 0 12px; } #bars { display: none; } }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div class="grain"></div>
    <div class="vign"></div>

    <a id="brand" href="index.html">← <b>LLMScale</b></a>
    <div id="chrome"><button id="lang">EN</button></div>

    <div id="hero">
      <div class="kicker" data-tr="// BİR DİL MODELİ, TAKIMYILDIZ OLARAK" data-en="// A LANGUAGE MODEL, AS A CONSTELLATION"></div>
      <h1>A MACHINE<br />READS YOUR <span class="p">WORDS</span></h1>
      <p class="sub" data-tr="Bir cümle, düğümlerden oluşan bir takımyıldıza dönüşür. Sürükle, dokun, ateşle — sonra kaydırıp içine gir." data-en="A sentence becomes a constellation of nodes. Drag, touch, fire — then scroll inside."></p>
      <div class="hint2" data-tr="⊹ SÜRÜKLE · ÜZERİNE GEL · TIKLA · KAYDIR" data-en="⊹ DRAG · HOVER · CLICK · SCROLL"></div>
    </div>

    <div id="scroll"></div>
    <div id="bars"></div>
    <div id="scrollhint" data-tr="KAYDIR ↓" data-en="SCROLL ↓"></div>

    <script type="module" src="/src/learn.js"></script>
  </body>
</html>
