<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <title>LLM 101 — how an LLM works, visualized | LLMScale</title>
    <meta name="description" content="An interactive, animated walkthrough of how a large language model turns a sentence into the next word — tokenization, embeddings, attention, layers and sampling, in 3D." />
    <!-- Umami analytics (self-hosted, privacy-friendly, cookieless) -->
    <script defer src="https://stats.delix.dev/u.js" data-website-id="22ee565e-f235-43fe-bd5e-3b693cbf86ca"></script>
    <style>
      :root {
        --bg1: #0a0f1b; --bg2: #0b1120; --ink: #e6ebf5; --muted: #93a1bd;
        --panel: rgba(13, 19, 34, 0.72); --line: rgba(255, 255, 255, 0.12); --chip: rgba(255, 255, 255, 0.06);
      }
      body.light {
        --bg1: #f8fafc; --bg2: #e9eef6; --ink: #0f172a; --muted: #475569;
        --panel: rgba(255, 255, 255, 0.92); --line: #e2e8f0; --chip: #f1f5f9;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; }
      body {
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color: var(--ink);
        background: radial-gradient(120% 120% at 70% 8%, var(--bg2), var(--bg1) 70%);
      }
      /* fixed 3D stage behind everything */
      #c { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; display: block; }
      #labels { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
      .lbl {
        position: absolute; transform: translate(-50%, -50%);
        font-weight: 650; font-size: 14px; color: var(--ink);
        text-shadow: 0 1px 8px rgba(0,0,0,.55); white-space: nowrap; transition: opacity .25s;
      }
      body.light .lbl { text-shadow: 0 1px 6px rgba(255,255,255,.75); }
      .lbl .sub { display: block; font: 600 10px/1 ui-monospace, monospace; color: var(--muted); margin-top: 3px; text-align: center; }
      .lbl.q {
        font-size: 15px; font-weight: 800; background: var(--panel); backdrop-filter: blur(4px);
        border: 1px solid var(--line); border-radius: 9px; padding: 3px 9px;
        box-shadow: 0 6px 18px -8px rgba(0,0,0,.6);
      }

      #chrome { position: fixed; top: 18px; right: 18px; z-index: 10; display: flex; gap: 8px; }
      #chrome button {
        font-size: 13px; padding: 7px 11px; border-radius: 11px; cursor: pointer;
        background: var(--panel); backdrop-filter: blur(10px); border: 1px solid var(--line); color: var(--ink);
      }
      #brand { position: fixed; top: 18px; left: 20px; z-index: 10; font: 700 14px/1 ui-monospace, monospace;
        letter-spacing: .5px; color: var(--ink); opacity: .8; text-decoration: none; }
      #brand:hover { opacity: 1; }
      #brand span { color: #8b5cf6; }

      /* scrolling narrative steps over the fixed stage */
      #scroll { position: relative; z-index: 2; }
      section { min-height: 100vh; display: flex; align-items: center; }
      .card {
        pointer-events: auto; margin: 0 0 0 clamp(16px, 5vw, 90px); max-width: min(400px, 84vw);
        background: var(--panel); backdrop-filter: blur(12px); border: 1px solid var(--line);
        border-radius: 18px; padding: 20px 22px; box-shadow: 0 24px 60px -30px rgba(0,0,0,.7);
        opacity: .35; transform: translateY(12px); transition: opacity .4s, transform .4s;
      }
      section.active .card { opacity: 1; transform: none; }
      .eyebrow { font: 600 11px/1 ui-monospace, monospace; letter-spacing: 2px; text-transform: uppercase;
        color: #8b5cf6; margin-bottom: 9px; }
      .card h2 { font-size: 21px; line-height: 1.15; margin: 0 0 10px; font-weight: 780; letter-spacing: -.01em; }
      .card h2 em { font-style: normal; background: linear-gradient(100deg,#8b5cf6,#22d3ee);
        -webkit-background-clip: text; background-clip: text; color: transparent; }
      body.light .eyebrow { color: #7c3aed; }
      body.light .card h2 em { background: linear-gradient(100deg,#7c3aed,#0891b2); -webkit-background-clip: text; background-clip: text; }
      .card p { font-size: 13.5px; line-height: 1.55; color: var(--muted); margin: 0; }
      .card p b { color: var(--ink); font-weight: 650; }
      .heads { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 12px; }
      .head { display: inline-flex; align-items: center; gap: 7px; cursor: pointer; font-size: 12px;
        padding: 5px 10px; border-radius: 999px; background: var(--chip); border: 1px solid var(--line);
        color: var(--ink); user-select: none; transition: opacity .15s; }
      .head .dot { width: 9px; height: 9px; border-radius: 999px; box-shadow: 0 0 8px currentColor; }
      .head.off { opacity: .38; } .head small { color: var(--muted); }
      .hint { font-size: 11.5px; color: var(--muted); margin-top: 10px; }
      .cta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
      .cta a { font-size: 12.5px; font-weight: 600; text-decoration: none; padding: 8px 12px; border-radius: 10px;
        color: #fff; background: linear-gradient(100deg, #7c3aed, #0891b2); }
      body.dark .cta a { color: #0a0f1b; background: linear-gradient(100deg, #a78bfa, #22d3ee); }
      .plabel { position: absolute; transform: translate(-50%, 0); text-align: center; white-space: nowrap;
        font-weight: 650; font-size: 12.5px; color: var(--ink); text-shadow: 0 1px 8px rgba(0,0,0,.5); }
      body.light .plabel { text-shadow: 0 1px 5px rgba(255,255,255,.8); }
      .plabel span { display: block; font: 600 10px/1 ui-monospace, monospace; color: var(--muted); margin-top: 3px; }
      .plabel.top { color: #22d3ee; } body.light .plabel.top { color: #0891b2; }

      #scrollhint { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 10;
        font-size: 12px; color: var(--muted); animation: bob 1.8s ease-in-out infinite; }
      @keyframes bob { 0%,100% { transform: translate(-50%, 0); opacity: .6; } 50% { transform: translate(-50%, 6px); opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { #scrollhint { animation: none; } }
      @media (max-width: 620px) { .card { margin: 0 12px; max-width: none; } .card h2 { font-size: 19px; } }
    </style>
    <script type="module" crossorigin src="/LLMScale/assets/learn-DBqHBrJI.js"></script>
    <link rel="modulepreload" crossorigin href="/LLMScale/assets/modulepreload-polyfill-B5Qt9EMX.js">
  </head>
  <body class="dark">
    <script>try{if(localStorage.getItem("theme")==="light")document.body.className="light";}catch(e){}</script>
    <canvas id="c"></canvas>
    <div id="labels"></div>
    <a id="brand" href="index.html" title="LLMScale">← LLM<span>101</span></a>
    <div id="chrome"><button id="theme">☀️</button><button id="lang">EN</button></div>
    <div id="scroll"></div>
    <div id="scrollhint"></div>
  </body>
</html>
